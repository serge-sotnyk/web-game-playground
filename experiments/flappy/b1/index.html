<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#071225" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Flip polarity and thread the reactor gates." />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Declared explicitly so the browser never falls back to /favicon.ico. -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Flux Flip</title>
  </head>
  <body>
    <div id="app">
      <!--
        Reads the CSS safe-area insets back out as resolved pixel values. Custom
        properties holding env() are not reliably readable via getComputedStyle,
        but resolved padding always is.
      -->
      <div id="safe-probe" aria-hidden="true"></div>

      <div id="game"></div>

      <button id="sound-toggle" type="button" aria-label="Mute sound" aria-pressed="false">
        <span class="sound-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path class="sound-body" d="M4 9h3.5L12 4.8v14.4L7.5 15H4z" />
            <g class="sound-waves">
              <path d="M15.4 8.6a4.8 4.8 0 0 1 0 6.8" />
              <path d="M17.9 6.1a8.3 8.3 0 0 1 0 11.8" />
            </g>
            <path class="sound-cross" d="M15.8 9.6l5.2 4.8M21 9.6l-5.2 4.8" />
          </svg>
        </span>
      </button>

      <p id="a11y-status" class="sr-only" role="status" aria-live="polite"></p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
